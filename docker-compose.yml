version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: healthguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthguard_user
      POSTGRES_PASSWORD: healthguard_secure_password_2026
      POSTGRES_DB: healthguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthguard_user -d healthguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthguard_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://healthguard_user:healthguard_secure_password_2026@postgres:5432/healthguard_db
      - SECRET_KEY=enterprise_production_super_secret_jwt_key_healthguard_ai_2026_x89f
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173", "http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/reports:/app/reports

  # Vite + React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthguard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
